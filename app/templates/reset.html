<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password</title>
<link rel="stylesheet" href="/static/app.css"></head><body style="background:#fff">
<div style="background:#1c5a6e;padding:18px 26px;color:#fff;font-size:24px;font-weight:600">
  {{ practice.name }}</div>
<div style="max-width:440px;margin:64px auto;padding:0 20px">

{% if dead %}
  <h1 style="font-size:30px;color:#1c5a6e;margin:0 0 12px">This link no longer works</h1>
  <p>Reset links can be used once and expire after 2 hours.</p>
  <p class="hint">Request a new one and it will arrive in a moment.</p>
  <p style="margin-top:26px"><a class="btn" href="/forgot">Request a new link</a></p>
{% else %}
  <h1 style="font-size:30px;color:#1c5a6e;margin:0 0 22px">Choose a new password</h1>
  {% if error %}
  <div style="background:#f9e6e4;border-left:3px solid #a93a31;color:#8a2f28;
              padding:12px 16px;margin-bottom:20px;font-size:14.5px">{{ error }}</div>
  {% endif %}
  <form method="post" action="/reset/{{ token }}" style="display:grid;gap:18px">
    <label>New password <span class="hint">(at least {{ MIN_PW }} characters)</span>
      <input type="password" name="password" required minlength="{{ MIN_PW }}" autofocus
        autocomplete="new-password"
        style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;
               background:#eef4fb;font-size:15px"></label>
    <label>Confirm new password
      <input type="password" name="confirm" required autocomplete="new-password"
        style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;
               background:#eef4fb;font-size:15px"></label>
    <div><button class="btn btn-green" style="padding:13px 30px;font-size:16px">
      Set password &amp; sign in</button></div>
  </form>
{% endif %}
</div></body></html>
