<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title>
<link rel="stylesheet" href="/static/app.css"></head><body style="background:#fff">
<div style="background:#1c5a6e;padding:18px 26px;color:#fff;font-size:24px;font-weight:600">
  {{ practice.name }}</div>
<div style="max-width:430px;margin:70px auto;padding:0 20px">
<h1 style="font-size:40px;color:#1c5a6e;margin:0 0 26px">Welcome Back</h1>

{% if notice %}
<div style="background:#e5f1ea;border-left:3px solid #2a7048;color:#1e5636;
            padding:12px 16px;margin-bottom:20px;font-size:14.5px">{{ notice }}</div>
{% endif %}

{% if error %}
<div style="background:#f9e6e4;border-left:3px solid #a93a31;color:#8a2f28;
            padding:12px 16px;margin-bottom:20px;font-size:14.5px">{{ error }}</div>
{% endif %}

<form method="post" action="/login" style="display:grid;gap:18px">
<input type="hidden" name="next" value="{{ next }}">
<label>Email<input type="email" name="email" required autofocus value="{{ email or '' }}"
 autocomplete="username"
 style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;background:#eef4fb;font-size:15px"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"
 style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;background:#eef4fb;font-size:15px"></label>
<div><button class="btn btn-green" style="padding:13px 34px;font-size:17px">Sign in</button></div>
</form>
<div style="margin-top:26px;border-top:1px solid var(--rule);padding-top:20px;
            display:flex;flex-direction:column;gap:10px">
  <a href="/forgot">Forgot your password?</a>
  <a href="/register"><b>First time here? Create an account</b></a>
  <a href="/request-access" class="hint">Or ask an administrator to set one up</a>
</div>
<p class="hint" style="margin-top:22px">Sessions end automatically after 20 minutes
  of inactivity.</p>
</div></body></html>
