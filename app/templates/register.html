<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account</title>
<link rel="stylesheet" href="/static/app.css"></head><body style="background:#fff">
<div style="background:#1c5a6e;padding:18px 26px;color:#fff;font-size:24px;font-weight:600">
  {{ practice.name }}</div>
<div style="max-width:470px;margin:52px auto;padding:0 20px">
  <h1 style="font-size:34px;color:#1c5a6e;margin:0 0 10px">Create an account</h1>
  <p class="hint" style="margin-bottom:24px">For staff who have not signed in before.
     You can sign in straight away; an administrator then gives you access to the
     parts of the system you need.</p>

  {% if error %}
  <div style="background:#f9e6e4;border-left:3px solid #a93a31;color:#8a2f28;
              padding:12px 16px;margin-bottom:20px;font-size:14.5px">{{ error }}</div>
  {% endif %}

  <form method="post" action="/register" style="display:grid;gap:17px">
    <label>Your name<input type="text" name="name" required autofocus value="{{ name }}"
      style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;
             background:#eef4fb;font-size:15px"></label>
    <label>Your email<input type="email" name="email" required value="{{ email }}"
      autocomplete="username"
      style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;
             background:#eef4fb;font-size:15px"></label>
    <label>Password <span class="hint">(at least {{ MIN_PW }} characters)</span>
      <input type="password" name="password" required minlength="{{ MIN_PW }}"
        autocomplete="new-password"
        style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;
               background:#eef4fb;font-size:15px"></label>
    <label>Confirm password<input type="password" name="confirm" required
      autocomplete="new-password"
      style="width:100%;padding:12px;border:1px solid #ccd4da;border-radius:4px;
             background:#eef4fb;font-size:15px"></label>
    <div><button class="btn btn-green" style="padding:13px 32px;font-size:16px">
      Create account</button></div>
  </form>

  <p style="margin-top:26px"><a href="/login">&larr; Already have an account? Sign in</a></p>
</div></body></html>
